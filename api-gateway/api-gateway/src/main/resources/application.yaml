spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Routes
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/register, /api/v1/users/login



        # USER-SERVICE
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter

        # MARKET-DATA-SERVICE
        - id: market-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/markets/**
          filters:
            - name: JwtAuthFilter

        # WEBSOCKET
        - id: market-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**


        # ORDER-SERVICE
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JwtAuthFilter

        # PORTFOLIO-SERVICE
        - id: portfolio-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portfolios/**
          filters:
            - name: JwtAuthFilter


